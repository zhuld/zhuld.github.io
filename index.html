---
layout: home
---

<section class="hero" id="home">
  <h1>欢迎来到我的主页</h1>
  <p class="hero-subtitle">这是一个展示个人项目和信息的地方</p>
  <a class="hero-button" href="#projects">查看项目</a>
</section>

<section class="section" id="about">
  <h2>关于我</h2>
  <p>在这里可以添加关于自己的信息、技能、经验等内容。</p>
</section>

<section class="section" id="projects">
  <h2>项目展示</h2>
  <p>在这里可以展示你的主要项目和成就。</p>

  <ul class="project-list">
    {%- for project in site.data.projects %}
    <li class="project-item">
      <a class="project-name" href="{{ project.url }}" target="_blank" rel="noopener">{{ project.name }}</a>
      <p class="project-desc">{{ project.description }}</p>
      <a class="project-github" href="{{ project.github }}" target="_blank" rel="noopener noreferrer" aria-label="{{ project.name }} 的 GitHub 仓库">
        <svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use></svg>
      </a>
    </li>
    {%- endfor %}
  </ul>
</section>

<section class="section" id="contact">
  <h2>联系方式</h2>
  <p>在这里可以添加你的联系方式和社交媒体链接。</p>
</section>
