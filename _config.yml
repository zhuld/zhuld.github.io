###########################################################
### zhuld.github.io — 基于 Beautiful Jekyll 主题的站点配置
###########################################################

############################
# --- 站点基础信息 --- #
############################

# 网站名称（导航栏左上角显示）
title: 项目列表

# 页脚显示的姓名
author: zhuld
  
email: lidongzhu@gmail.com

url: "https://zhuld.github.io"
baseurl: ""

# HTML lang 属性
language: zh-CN

###############################################
# --- 导航栏链接（单页锚点） --- #
###############################################

navbar-links:
  关于我: "#about"
  项目: "#projects"

#####################################
# --- 页脚社交链接 --- #
#####################################

social-network-links:
  github: zhuld
  email: lidongzhu@gmail.com

# 提供描述后会在页面 head 中加入 feed.xml 订阅链接
rss-description: zhuld 的个人主页

###########################
# --- 通用选项 --- #
###########################

# 页脚显示的站点地址
url-pretty: "zhuld.github.io"

excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: false
post_search: false
edit_page_button: false

######################################
# --- 配色 --- #
######################################

page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#008AFF"
hover-col: "#0085A1"
navbar-col: "#EAEAEA"
navbar-text-col: "#404040"
navbar-border-col: "#DDDDDD"
footer-col: "#EAEAEA"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#0085A1"

# 站点自定义样式（在主题样式之后加载）
site-css:
  - "/assets/css/custom-styles.css"

################
# --- 其他 --- #
################

date_format: "%Y-%m-%d"
timezone: "Asia/Shanghai"
markdown: kramdown
highlighter: rouge
permalink: /:title/
paginate: 5

kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"

# 主题与插件（remote_theme 同时兼容 GitHub Pages 的分支构建与 Actions 构建）
remote_theme: daattali/beautiful-jekyll@6.0.1
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap

# 不参与构建的文件
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules
  - vendor
